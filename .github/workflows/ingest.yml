name: Ingest

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      - run: npm run ingest -- --force --skip-import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      - run: curl -fsS -X POST -H "x-revalidate-secret: $REVALIDATE_SECRET" "$APP_URL/api/revalidate"
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
